name: CI

# Runs on every push and pull request. Deploys are handled by the Vercel Git integration (push to main); this workflow only gates quality.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tracked secrets, real phone numbers, tracked .env files, non-public lockfile hosts.
      - run: npm run scan:secrets
      # typecheck, unit + flow + hold tests, eval (replay), eval unit + smoke, db invariants on PGlite. No secrets or network needed.
      - run: npm run verify
      - run: npm run lint:ui
      # Deterministic simulation of the voice path under a hostile network (dup/reorder/drop/forged webhooks). A failing seed is printed with its replay command.
      - run: npm run sim -- --seeds 500
      # `next build` imports every route module: it must succeed with no API keys in the environment (CLAUDE.md invariant 11).
      - run: npm run build

  # Optional: keeps the Remotion project in video/ type-correct (no render, no browser download). It imports the app's components and
  # lib types through the @ alias, so the root install is needed too. continue-on-error: a video typing slip never blocks the app.
  video-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: video
      - run: npx tsc --noEmit
        working-directory: video
